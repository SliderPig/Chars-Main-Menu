plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0'
group = 'com.example.charmenu'

base {
    archivesName = 'charmenu'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// gradlew build -Psmoke: adds src/smoke (the walk-through that takes screenshots), never part of a normal jar
if (project.hasProperty('smoke')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

mixin {
    add sourceSets.main, 'charmenu.refmap.json'
    config 'charmenu.mixins.json'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : 'charmenu',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'MixinConfigs'          : 'charmenu.mixins.json'
        ])
    }
}
